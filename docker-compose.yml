version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: brex_pgvector
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: brex_autopay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.0-alpine
    container_name: brex_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
